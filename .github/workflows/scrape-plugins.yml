name: Scrape KOReader plugins, patches, and fonts

on:
  schedule:
    # Every hour.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      package:
        description: Existing plugin package ID to refresh (leave blank for a full scrape)
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: scrape-koreader
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run plugin scraper
        id: scrape_plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PACKAGE: ${{ inputs.package }}
        run: |
          set -eu
          if [ -n "$TARGET_PACKAGE" ]; then
            python3 .github/scripts/scrape_koplugins.py --package "$TARGET_PACKAGE"
          else
            python3 .github/scripts/scrape_koplugins.py
          fi

      - name: Run patch scraper
        id: scrape_patches
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.package == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/scrape_kopatches.py

      - name: Refresh cached font packages
        id: scrape_fonts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.package == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/scrape_fonts.py

      - name: Merge scraper outputs
        id: scrape
        env:
          PLUGIN_ADDED_COUNT: ${{ steps.scrape_plugins.outputs.added_count }}
          PLUGIN_UPDATED_COUNT: ${{ steps.scrape_plugins.outputs.updated_count }}
          PATCH_ADDED_COUNT: ${{ steps.scrape_patches.outputs.added_count }}
          PATCH_UPDATED_COUNT: ${{ steps.scrape_patches.outputs.updated_count }}
          FONT_UPDATED_COUNT: ${{ steps.scrape_fonts.outputs.updated_count }}
        run: |
          set -eu
          echo "added_count=$(( ${PLUGIN_ADDED_COUNT:-0} + ${PATCH_ADDED_COUNT:-0} ))" >> "$GITHUB_OUTPUT"
          echo "updated_count=$(( ${PLUGIN_UPDATED_COUNT:-0} + ${PATCH_UPDATED_COUNT:-0} + ${FONT_UPDATED_COUNT:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Regenerate and validate catalog
        run: |
          set -eu
          sh generate-manifest.sh
          jq empty manifest.json
          meta_count="$(find packages -name '.meta' | wc -l | tr -d ' ')"
          package_count="$(jq '.packages | length' manifest.json)"
          versions_count="$(find packages -name 'versions.json' | wc -l | tr -d ' ')"
          test "$meta_count" = "$package_count"
          test "$meta_count" = "$versions_count"
          find packages -name 'versions.json' -exec jq empty {} +

      - name: Commit scraped package changes
        id: commit
        if: ${{ steps.scrape.outputs.added_count != '0' || steps.scrape.outputs.updated_count != '0' }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The category cache is an implementation detail; package metadata is the source of truth.
          git restore -- .github/scripts/plugin_categories.json
          git add --all -- manifest.json packages
          if git diff --cached --quiet; then
              echo "No scraped package changes to commit."
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          git commit -m "Refresh scraped KOReader packages"
          COMMIT_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch GitHub Pages deployment
        if: ${{ steps.scrape.outputs.added_count != '0' || steps.scrape.outputs.updated_count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ steps.commit.outputs.sha }}
        run: gh workflow run pages-deploy.yml --ref main --field source_ref="$SOURCE_REF"
